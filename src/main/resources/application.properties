spring.application.name=ai-ilink

# ========== 文本对话模型 ==========
llm.base-url=${LLM_BASE_URL:}
llm.model=${LLM_MODEL:}
llm.api-key=${LLM_API_KEY:}

# ========== 视觉模型 ==========
llm.vision-base-url=${LLM_VISION_BASE_URL:}
llm.vision-model=${LLM_VISION_MODEL:}
llm.vision-api-key=${LLM_VISION_API_KEY:}

# 文生图（阿里百炼 qwen-image）
llm.draw-base-url=${LLM_DRAW_BASE_URL:}
llm.draw-model=${LLM_DRAW_MODEL:}
llm.draw-api-key=${LLM_DRAW_API_KEY:}

# ========== 语音合成 TTS ==========
llm.tts-base-url=${LLM_TTS_BASE_URL:}
llm.tts-model=${LLM_TTS_MODEL:}
llm.tts-api-key=${LLM_TTS_API_KEY:}

# ========== 语音识别 STT（DashScope SDK WebSocket） ==========
llm.stt-api-key=${LLM_STT_API_KEY:}
asr.model=${ASR_MODEL:paraformer-realtime-v2}
silk.decoder-path=${SILK_DECODER_PATH:silk_v3_decoder.exe}

# ========== 天气key(高德) ==========
weather.api-key=${WEATHER_API_KEY:}
weather.base-url=${WEATHER_BASE_URL:}

# ========== Metaso 联网搜索 ==========
metaso.api-key=${LLM_SEARCH_KEY:}
metaso.base-url=https://metaso.cn

# ========== 文档生成 ==========
document.output-dir=data/documents
resume.output-dir=data/resumes

# ========== 天眼查 API ==========
tianyancha.api-key=${TIANYANCHA_API_KEY:}
tianyancha.base-url=https://open.api.tianyancha.com

# ========== MySQL 数据源 ==========
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:ai_ilink}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:ai_ilink}
spring.datasource.password=${MYSQL_PASSWORD:ai_ilink123}
spring.datasource.hikari.maximum-pool-size=10
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ========== Redis 缓存 ==========
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=5s

# ========== MyBatis ==========
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# ========== Bot 配置 ==========
bot.max-bots=10
bot.qr-refresh-interval=60
bot.qr-timeout=120
bot.login-timeout=180

# ========== 通用配置 ==========
llm.system-prompt=你是一个智能、乐于助人的微信助手。你可以敏锐地感知用户提供的文本、图片摘要等多模态上下文，并作出准确、友好、自然的回复。如果用户要求用语音回复，请直接回复 [VOICE]；如果用户要求切换音色，请直接回复 [VOICE_SWITCH:音色名]；如果用户要求画图，请调用 generate_image 工具。
llm.max-tokens=2048
llm.temperature=0.7
llm.max-history=20

# ========== 记忆（Context Manager） ==========
llm.memory.extraction-enabled=true
llm.memory.extraction-sample-rate=1.0
llm.memory.summarize-every=10

# ========== 管理 API ==========
management.api.token=${MANAGEMENT_API_TOKEN:change-me-in-production}

# ========== LibreOffice 配置（Word 转 PDF） ==========
libreoffice.path=D:/tools/LibreOffice/program/soffice.exe

# ========== RAG 知识库检索 ==========
rag.enabled=true
rag.index-on-startup=true
# 切分：单片段最大字符数 / 相邻片段重叠字符数（保住跨片段的语义）
rag.chunk.max-chars=800
rag.chunk.overlap-chars=120
# 检索：最终返回片段数 / 召回候选倍数 / 单文档最大占比（防同一文档刷屏）
rag.retrieve.top-k=4
rag.retrieve.candidate-multiplier=3
rag.retrieve.max-per-document=2
# 融合权重：向量语义分 / 关键词字面分（两者各自归一化后加权）
rag.fuse.vector-weight=0.65
# 灌入上下文的字符预算（超出按分数截断）
rag.context.max-chars=4000
# 向量模型（DashScope 文本向量；密钥缺省复用文本对话 key）
rag.embedding.base-url=${RAG_EMBEDDING_BASE_URL:}
# 密钥缺省复用 DashScope 语音识别 key（同为 DashScope 账号）；都没有则降级为本地词法向量
rag.embedding.api-key=${RAG_EMBEDDING_API_KEY:${LLM_STT_API_KEY:}}
rag.embedding.model=${RAG_EMBEDDING_MODEL:text-embedding-v4}
rag.embedding.dimension=${RAG_EMBEDDING_DIM:1024}
# 无密钥时的离线降级向量维度（词法哈希向量，仅保证链路可用，语义能力受限）
rag.embedding.fallback-dimension=512
# 精排（DashScope gte-rerank；需 dashscope-sdk-java >= 2.22，默认关闭）
rag.rerank.enabled=${RAG_RERANK_ENABLED:false}
rag.rerank.model=${RAG_RERANK_MODEL:gte-rerank-v2}
# 启动时索引的文档目录（类路径资源由代码内置扫描）
rag.upload-dirs=data/documents,data/resumes